<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>教學示意素材說明</title><style>body{max-width:720px;margin:60px auto;padding:24px;font:18px/1.9 sans-serif;color:#245b48;background:#eef4ef}h1{font-size:28px}</style><h1>本系統自製的操作示意</h1><p>field-observation.svg 與 field-observation.webm 是本系統的介面展示素材，用來示範如何留下全田、植株與細節的觀察紀錄。</p><p>素材沒有使用真實田間照片，也沒有模擬特定病徵。不是農業部製作的圖片或影片，不能用來判斷病蟲害。</p><p>建議內容所附的農業部連結是農藝參考原文，與這份自製素材的作者來源不同。</p></html>
